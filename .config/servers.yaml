servers:
  - name: httpserver
    addrs: ["0.0.0.0:8020", "127.0.0.1:8091", "/tmp/test.sock"]
    recv_timeout: 3000
    send_timeout: 3000
    accept_scheduler: accept
    process_scheduler: accept
    type: http
    keepalive: 0
    ssl: 0
    cert_file: "./server.crt"
    key_file: "./server.key"